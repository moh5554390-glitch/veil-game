<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Veil</title><meta name="theme-color" content="#07070d"/><link rel="manifest" href="/manifest.json"/><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>:root{--bg:#07070d;--card:#10101c;--p:#7b5cff;--p2:#3b82f6;--g:#a78bfa;--t:#e8eaf2;--m:#8b93a7;--b:rgba(123,92,255,.22);--d:#ef4444;--s:#22c55e}*{box-sizing:border-box;margin:0;padding:0}html,body,#app{height:100%;height:100dvh}body{font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--t);overflow:hidden}.hidden{display:none!important}.page{height:100%;max-width:480px;margin:0 auto;padding:1.15rem;padding-bottom:calc(1.15rem + env(safe-area-inset-bottom));overflow-y:auto;position:relative}.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:.88rem 1.3rem;border-radius:999px;font-weight:600;border:none;cursor:pointer;font-size:1rem}.btn-p{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.btn-o{background:transparent;border:1px solid var(--b);color:var(--t)}.btn-g{background:transparent;border:none;color:var(--m);width:auto;padding:.4rem .7rem;font-size:.85rem}.input{width:100%;padding:.88rem 1rem;background:var(--bg);border:1px solid var(--b);border-radius:12px;color:var(--t);font-size:1rem;margin-bottom:.7rem}.card{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:1.15rem;margin-bottom:.85rem}.logo{font-size:2.4rem;font-weight:700;text-align:center;background:linear-gradient(90deg,#c4b5fd,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.tag{text-align:center;color:var(--g);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;margin:.35rem 0 1rem}.muted{color:var(--m);font-size:.88rem}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}.bar{display:flex;gap:.3rem;mar pp"><div id="intro" class="page"><button class="btn btn-g lang" id="langBtn">EN</button><div class="il">Veil</div><p class="it">EVERY CLUE HIDES THE TRUTH</p><div class="line"></div><button class="btn btn-o sk" style="width:auto;padding:.55rem 1.4rem" id="skip">Skip</button></div><div id="login" class="page hidden" style="display:flex;flex-direction:column;justify-content:center"><button class="btn btn-g lang" id="langBtn2">EN</button><div class="logo">Veil</div><p class="tag">Every Clue Hides The Truth</p><div class="card"><input class="input" id="user"/><button class="btn btn-p" id="goLogin">Enter</button><p class="muted" id="err" style="color:var(--d);text-align:center;margin-top:.6rem"></p></div></div><div id="home" class="page hidden"><div class="top"><div><div class="logo" style="font-size:1.45rem;text-align:start">Veil</div><p class="muted" id="hi">—</p></div><div><button class="btn btn-g" id="langBtn3">EN</button><button class="btn btn-g" id="out">Out</button></div></div><div class="card"><div class="stats"><div><div class="n" id="lv">1</div><div class="l">Level</div></div><div><div class="n" id="pts">0</div><div class="l">Points</div></div><div><div class="n" id="xp">0</div><div class="l">XP</div></div></div></div><button class="btn btn-p" style="margin-bottom:.4rem" id="btnSolo">Solo</button><button class="btn btn-o" style="margin-bottom:.4rem" id="btnGen">Generate Case</button><button class="btn btn-o" style="margin-bottom:.4rem" id="btnHotseat">Local Room</button><button class="btn btn-o" style="margin-bottom:.4rem" id="btnOnlineHost">Online Room</button><div class="card"><p style="font-weight:600;margin-bottom:.5rem" id="joinLbl">Join Online</p><div style="display:flex;gap:.5rem"><input class="input" id="joinCode" style="margin:0;flex:1"/><button class="btn btn-p" style="width:auto;padding:.88rem 1.1rem" id="btnJoinOnline">Join</button></div><p class="muted" id="netStatus" style="margin-top:.5rem;font-size:.8rem"></p></div><p class="muted" style="margin id="exit">End</button></div><div class="bar" id="bar"></div><div id="body"></div><button class="btn btn-p" style="margin-top:.85rem" id="next">Next</button></div></div><script>
const I={ar:{skip:'تخطي / دخول',enter:'دخول',out:'خروج',solo:'لعب منفرد',gen:'توليد قضية جديدة',hotseat:'غرفة محلية',online:'غرفة أونلاين',join:'انضمام أونلاين',joinB:'انضم',cases:'القضايا',hi:'مرحبًا، ',who:'من المسؤول؟',ok:'صحيحة',bad:'خاطئة',home:'الرئيسية',needName:'أدخل اسمًا',needRole:'اختر دورًا',needVote:'اختر',needP:'أضف لاعبًا',phase:'المرحلة: ',host:'مضيف',guest:'ضيف',waitP:'بانتظار اللاعبين',waitS:'بانتظار البدء',pass:'سلّم الجهاز',ev:'الأدلة',role:'الدور',dis:'النقاش',vote:'التصويت',rev:'كشف',ph:['الإنترو','الأدوار','الأدلة','النقاش','التصويت','النهاية']},en:{skip:'Skip / Enter',enter:'Enter',out:'Logout',solo:'Solo',gen:'Generate Case',hotseat:'Local Room',online:'Online Room',join:'Join Online',joinB:'Join',cases:'Cases',hi:'Hello, ',who:'Who is guilty?',ok:'Correct',bad:'Wrong',home:'Home',needName:'Enter a name',needRole:'Pick a role',needVote:'Pick one',needP:'Add a player',phase:'Phase: ',host:'Host',guest:'Guest',waitP:'Waiting players',waitS:'Waiting start',pass:'Pass device',ev:'Evidence',role:'Role',dis:'Discussion',vote:'Vote',rev:'Reveal',ph:['Intro','Roles','Evidence','Discussion','Voting','Finale']}};

const AR=[{id:'hallway',title:'الظل في الممر',blurb:'قصر.',intro:'منتصف الليل. صرخة ثم صمت.',roles:[{key:'detective',name:'المحقق',desc:'',priv:'بصمة غير مسجّلة.'},{key:'servant',name:'الخادم',desc:'',priv:'تبتز الضحية.'},{key:'heir',name:'الوريث',desc:'',priv:'سمعت خطوات.'},{key:'guest',name:'الضيف',desc:'',priv:'لم أقترب من المكتبة.'}],evidence:[{t:'المكتبة',d:'الجثة.'},{t:'رسالة',d:'تهديد.'},{t:'شهادة',d:'2:10.'},{t:'الباب',d:'طين.'}],votes:[{id:'guest',l:'الضيف'},{id:'servant',l:'الخادم'},{id:'heir',l:'الوريث'},{id:'detective',l:'المحقق'}],correct:'servant',finale:'الخادم الجاني.'},{id:'ferry',title:'آخر رحلة العبّارة',blurb:'مفقود.',intro:'غرفة مغلقة من الداخل.',roles:[{key:'captain',name:'القبطان',desc:'',priv:'غيّرت المسار.'},{key:'partner',name:'الشريك',desc:'',priv:'تزوير.'},{key:'journalist',name:'الصحفية',desc:'',priv:'رأيت الشريك.'},{key:'steward',name:'المضيف',desc:'',priv:'مفتاح للشريك.'}],evidence:[{t:'كابينة',d:'مقفل.'},{t:'حسابات',d:'ممزقة.'},{t:'شهادة',d:'1:40.'},{t:'معطف',d:'مبلل.'}],votes:[{id:'captain',l:'القبطان'},{id:'partner',l:'الشريك'},{id:'journalist',l:'الصحفية'},{id:'steward',l:'المضيف'}],correct:'partner',finale:'الشريك الجاني.'}];
const EN=[{id:'hallway',title:'Shadow Hallway',blurb:'Mansion.',intro:'Midnight. One scream, silence.',roles:[{key:'detective',name:'Detective',desc:'',priv:'Unregistered print.'},{key:'servant',name:'Servant',desc:'',priv:'You blackmailed them.'},{key:'heir',name:'Heir',desc:'',priv:'Heard steps.'},{key:'guest',name:'Guest',desc:'',priv:'Not near library late.'}],evidence:[{t:'Library',d:'Body.'},{t:'Note',d:'Threat.'},{t:'Witness',d:'2:10.'},{t:'Door',d:'Mud.'}],votes:[{id:'guest',l:'Guest'},{id:'servant',l:'Servant'},{id:'heir',l:'Heir'},{id:'detective',l:'Detective'}],correct:'servant',finale:'Servant did it.'},{id:'ferry',title:'Last Ferry',blurb:'Missing.',intro:'Locked from inside.',roles:[{key:'captain',name:'Captain',desc:'',priv:'Changed course.'},{key:'partner',name:'Partner',desc:'',priv:'Fraud exposed.'},{key:'journalist',name:'Journalist',desc:'',priv:'Saw partner.'},{key:'steward',name:'Steward',desc:'',priv:'Gave a key.'}],evidence:[{t:'Cabin',d:'Locked.'},{t:'Ledger',d:'Torn.'},{t:'Witness',d:'1:40.'},{t:'Coat',d:'Wet.'}],votes:[{id:'captain',l:'Captain'},{id:'partner',l:'Partner'},{id:'journalist',l:'Journalist'},{id:'steward',l:'Steward'}],correct:'partner',finale:'Partner did it.'}];
let lang=localStorage.getItem('veil_lang')||'ar';let CASES=[];let gens=[];try{gens=JSON.parse(localStorage.getItem('veil_gens')||'[]')}catch(e){}
function t(k){return(I[lang]||I.ar)[k]||k}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function rebuild(){CASES=(lang==='en'?EN:AR).map(c=>JSON.parse(JSON.stringify(c))).concat(gens.filter(g=>g.lang===lang).slice(-8))}
function genCase(){const places=lang==='en'?['hotel','lab','villa']:['فندق','مختبر','فيلا'];const motives=lang==='en'?['debt','theft']:['دين','سرقة'];const place=pick(places),motive=pick(motives);const roles=lang==='en'?[{key:'r0',name:'Detective',priv:'Timeline break.'},{key:'r1',name:'Partner',priv:'Hid '+motive+'.'},{key:'r2',name:'Rival',priv:'Lied about alibi.'},{key:'r3',name:'Witness',priv:'Saw partner.'}]:[{key:'r0',name:'المحقق',priv:'كسر الزمن.'},{key:'r1',name:'الشريك',priv:'أخفى '+motive+'.'},{key:'r2',name:'المنافس',priv:'كذب.'},{key:'r3',name:'الشاهد',priv:'رأى الشريك.'}];const c={id:'g'+Date.now(),lang,title:(lang==='en'?'Case: ':'قضية: ')+place,blurb:motive,intro:lang==='en'?'A body at the '+place+'.':'جثة في '+place+'.',roles,evidence:lang==='en'?[{t:'Scene',d:'Traces.'},{t:'Note',d:motive},{t:'Time',d:'Conflict.'},{t:'Tool',d:'Foreign.'}]:[{t:'المسرح',d:'آثار.'},{t:'رسالة',d:motive},{t:'وقت',d:'تضارب.'},{t:'أداة',d:'غريبة.'}],votes:roles.map(r=>({id:r.key,l:r.name})),correct:'r1',finale:lang==='en'?'Partner did it.':'الشريك الجاني.'};gens.push(c);gens=gens.slice(-12);localStorage.setItem('veil_gens',JSON.stringify(gens));rebuild();return c}
function applyUI(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('skip').textContent=t('skip');document.getElementById('goLogin').textContent=t('enter');document.getElementById('out').textContent=t('out');document.getElementById('btnSolo').textContent=t('solo');document.getElementById('btnGen').textContent=t('gen');document.getElementById('btnHotseat').textContent=t('hotseat');document.getElementById('btnOnlineHost').textContent=t('online');document.getElementById('joinLbl').textContent=t('join');document.getElementById('btnJoinOnline').textContent=t('joinB');document.getElementById('casesLbl').textContent=t('cases');document.getElementById('user').placeholder=lang==='en'?'Your name':'اسمك';document.getElementById('joinCode').placeholder=lang==='en'?'Room code':'كود الغرفة';['langBtn','langBtn2','langBtn3'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=lang==='ar'?'EN':'ع'})}
function toggleLang(){lang=lang==='ar'?'en':'ar';localStorage.setItem('veil_lang',lang);rebuild();applyUI();if(S.user)home()}
let S={user:null,mode:'solo',caseId:null,role:null,phase:'intro',vote:null,players:[],assignments:{},revealIndex:0,votes:{},votePlayerIndex:0};let peer=null,connections={},isHost=false,myPeerId=null,roomPlayers=[];
function C(){return CASES.find(c=>c.id===S.caseId)||CASES[0]}
function show(n){['intro','login','home','onlineLobby','lobby','pass','roles','game'].forEach(v=>{const el=document.getElementById(v);if(el)el.classList.toggle('hidden',v!==n)})}
function save(){if(S.user)localStorage.setItem('veil_v7',JSON.stringify({user:S.user,t:Date.now()}))}
function load(){try{const d=JSON.parse(localStorage.getItem('veil_v7')||'null');if(d&&d.user&&Date.now()-d.t<30*864e5)return d.user}catch(e){}return null}
function setNet(m){document.getElementById('netStatus').textContent=m||''}
rebuild();let timer;function boot(){applyUI();show('intro');clearTimeout(timer);timer=setTimeout(afterIntro,3400)}
function afterIntro(){clearTimeout(timer);const u=load();if(u){S.user=u;home()}else show('login')}
document.getElementById('skip').onclick=afterIntro;['langBtn','langBtn2','langBtn3'].forEach(id=>{const el=document.getElementById(id);if(el)el.onclick=toggleLang});
document.getElementById('goLogin').onclick=function(){const n=document.getElementById('user').value.trim();if(n.length<2){document.getElementById('err').textContent=t('needName');return}S.user={name:n,level:1,xp:0,pts:0};save();home()};
document.getElementById('out').onclick=function(){cleanupPeer();localStorage.removeItem('veil_v7');S.user=null;show('login')};
function home(){applyUI();document.getElementById('hi').textContent=t('hi')+S.user.name;document.getElementById('lv').textContent=S.user.level;document.getElementById('pts').textContent=S.user.pts;document.getElementById('xp').textContent=S.user.xp;document.getElementById('caseList').innerHTML=CASES.map(c=>'<button type="button" class="btn btn-o" style="margin-bottom:.4rem;text-align:start" data-id="'+c.id+'"><strong>'+c.title+'</strong><br><span class="muted">'+c.blurb+'</span></button>').join('');document.querySelectorAll('#caseList button').forEach(b=>{b.onclick=function(){S.mode='solo';S.caseId=b.getAttribute('data-id');S.role=null;renderRolePick();show('roles')}});show('home')}
document.getElementById('btnSolo').onclick=function(){S.mode='solo';S.caseId=CASES[0].id;S.role=null;renderRolePick();show('roles')};
document.getElementById('btnGen').onclick=function(){const c=genCase();S.mode='solo';S.caseId=c.id;S.role=null;renderRolePick();show('roles')};
document.getElementById('btnHotseat').onclick=function(){S.mode='hotseat';S.players=[{name:S.user.name}];S.caseId=CASES[0].id;document.getElementById('lobbyCase').innerHTML=CASES.map(c=>'<option value="'+c.id+'">'+c.title+'</option>').join('');renderLobby();show('lobby')};
function cleanupPeer(){try{Object.values(connections).forEach(c=>{try{c.close()}catch(e){}})}catch(e){}connections={};if(peer){try{peer.destroy()}catch(e){}peer=null}isHost=false;myPeerId=null;roomPlayers=[]}
document.getElementById('btnOnlineHost').onclick=function(){setNet('...');cleanupPeer();if(typeof Peer==='undefined'){setNet('No net');return}isHost=true;peer=new Peer();peer.on('open',function(id){myPeerId=id;roomPlayers=[{peerId:id,name:S.user.name,isHost:true}];document.getElementById('roomCodeDisplay').textContent=id;document.getElementById('olMeta').textContent=t('host');document.getElementById('olCase').innerHTML=CASES.map(c=>'<option value="'+c.id+'">'+c.title+'</option>').join('');document.getElementById('btnStartOnline').classList.remove('hidden');document.getElementById('olWait').textContent=t('waitP');renderOlPlayers();show('onlineLobby');setNet('')});peer.on('connection',function(conn){connections[conn.peer]=conn;conn.on('data',function(msg){handleMsg(conn,msg)});conn.on('close',function(){delete connections[conn.peer];roomPlayers=roomPlayers.filter(p=>p.peerId!==conn.peer);broadcast({type:'players',players:roomPlayers});renderOlPlayers()})});peer.on('error',function(err){setNet(err.type)})};
document.getElementById('btnJoinOnline').onclick=function(){const code=document.getElementById('joinCode').value.trim();if(!code)return;setNet('...');cleanupPeer();if(typeof Peer==='undefined')return;isHost=false;peer=new Peer();peer.on('open',function(id){myPeerId=id;const conn=peer.connect(code,{reliable:true});connections[code]=conn;conn.on('open',function(){conn.send({type:'hello',name:S.user.name,peerId:id});document.getElementById('roomCodeDisplay').textContent=code;document.getElementById('olMeta').textContent=t('guest');document.getElementById('btnStartOnline').classList.add('hidden');document.getElementById('olWait').textContent=t('waitS');document.getElementById('olCase').innerHTML=CASES.map(c=>'<option value="'+c.id+'">'+c.title+'</option>').join('');show('onlineLobby');setNet('OK')});conn.on('data',function(msg){handleMsg(conn,msg)})})};
function handleMsg(conn,msg){if(!msg||!msg.type)return;if(msg.type==='hello'&&isHost){if(!roomPlayers.some(p=>p.peerId===msg.peerId))roomPlayers.push({peerId:msg.peerId,name:msg.name,isHost:false});conn.send({type:'players',players:roomPlayers});broadcast({type:'players',players:roomPlayers});renderOlPlayers()}if(msg.type==='players'){roomPlayers=msg.players||[];renderOlPlayers()}if(msg.type==='start')beginOnline(msg);if(msg.type==='phase'){S.phase=msg.phase;if(msg.vote)S.vote=msg.vote;renderGame();show('game')}if(msg.type==='vote')S.votes[msg.name]=msg.choice}
function broadcast(msg){Object.values(connections).forEach(c=>{try{if(c.open)c.send(msg)}catch(e){}})}
function renderOlPlayers(){document.getElementById('olCount').textContent='('+roomPlayers.length+')';document.getElementById('olPlayers').innerHTML=roomPlayers.map(p=>'<div style="padding:.4rem 0;border-bottom:1px solid var(--b)">'+p.name+(p.isHost?' <span class="pill">'+t('host')+'</span>':'')+(p.peerId===myPeerId?' *':'')+'</div>').join('')}
document.getElementById('btnStartOnline').onclick=function(){if(!isHost)return;const caseId=document.getElementById('olCase').value;let roles=(CASES.find(c=>c.id===caseId)||CASES[0]).roles.slice();for(let i=roles.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=roles[i];roles[i]=roles[j];roles[j]=x}const assignments={};roomPlayers.forEach((p,idx)=>{assignments[p.peerId]=roles[idx%roles.length].key});const payload={type:'start',caseId,assignments,players:roomPlayers};broadcast(payload);beginOnline(payload)};
function beginOnline(msg){S.mode='online';S.caseId=msg.caseId;S.assignments=msg.assignments;S.role=msg.assignments[myPeerId];S.phase='intro';S.vote=null;S.votes={};roomPlayers=msg.players||roomPlayers;renderGame();show('game')}
document.getElementById('leaveOnline').onclick=function(){cleanupPeer();home()};
function renderLobby(){document.getElementById('playerList').innerHTML=S.players.map((p,i)=>'<div style="display:flex;justify-content:space-between;padding:.5rem 0"><span>'+(i+1)+'. '+p.name+'</span>'+(i>0?'<button type="button" class="btn-g" data-rm="'+i+'">x</button>':'')+'</div>').join('');document.querySelectorAll('[data-rm]').forEach(btn=>{btn.onclick=function(){S.players.splice(+btn.getAttribute('data-rm'),1);renderLobby()}})}
document.getElementById('addPlayer').onclick=function(){const n=document.getElementById('newPlayer').value.trim();if(!n||S.players.length>=4)return;S.players.push({name:n});document.getElementById('newPlayer').value='';renderLobby()};
document.getElementById('leaveLobby').onclick=function(){home()};
document.getElementById('startHotseat').onclick=function(){if(S.players.length<2){alert(t('needP'));return}S.caseId=document.getElementById('lobbyCase').value;let roles=C().roles.slice();for(let i=roles.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=roles[i];roles[i]=roles[j];roles[j]=x}S.assignments={};S.players.forEach((p,idx)=>{S.assignments[p.name]=roles[idx%roles.length].key});S.revealIndex=0;showPass()};
function showPass(){const p=S.players[S.revealIndex];if(!p){S.phase='intro';renderGame();show('game');return}document.getElementById('passName').textContent=p.name;show('pass')}
document.getElementById('revealRole').onclick=function(){const p=S.players[S.revealIndex];const role=C().roles.find(r=>r.key===S.assignments[p.name]);show('game');document.getElementById('gTitle').textContent=C().title;document.getElementById('gPhase').textContent=p.name;document.getElementById('bar').innerHTML='';document.getElementById('body').innerHTML='<div class="card"><div style="font-size:1.3rem;font-weight:700;color:var(--g)">'+role.name+'</div><p class="muted">'+role.priv+'</p></div>';document.getElementById('next').textContent=t('pass');document.getElementById('next').onclick=function(){S.revealIndex++;if(S.revealIndex<S.players.length)showPass();else{S.phase='intro';document.getElementById('next').onclick=defaultNext;renderGame();show('game')}}};
function renderRolePick(){const c=C();document.getElementById('caseHint').textContent=c.title;document.getElementById('roleList').innerHTML=c.roles.map(r=>'<button type="button" class="opt'+(S.role===r.key?' sel':'')+'" data-k="'+r.key+'"><strong>'+r.name+'</strong></button>').join('');document.querySelectorAll('#roleList .opt').forEach(b=>{b.onclick=function(){S.role=b.getAttribute('data-k');renderRolePick()}})}
document.getElementById('confirmRole').onclick=function(){if(!S.role){alert(t('needRole'));return}S.phase='intro';renderGame();show('game')};
document.getElementById('backHome').onclick=function(){home()};
function renderBar(){const i=P.indexOf(S.phase);document.getElementById('bar').innerHTML=P.map((p,x)=>'<div class="dot'+(x<i?' ok':'')+(x===i?' on':'')+'"></div>').join('')}
function roleObj(){return C().roles.find(r=>r.key===S.role)||C().roles[0]}
function renderGame(){const c=C(),r=roleObj();document.getElementById('gTitle').textContent=c.title;document.getElementById('gPhase').textContent=t('phase')+t('ph')[P.indexOf(S.phase)];renderBar();const b=document.getElementById('body'),n=document.getElementById('next');n.classList.remove('hidden');n.onclick=defaultNext;
if(S.phase==='intro'){b.innerHTML='<div class="card" style="text-align:center"><p class="tag">INTRO</p><h3 style="color:var(--g)">'+c.title+'</h3><p class="muted">'+c.intro+'</p>'+(S.mode==='online'?'<p class="muted" style="margin-top:.6rem"><strong style="color:var(--g)">'+r.name+'</strong> — '+r.priv+'</p>':'')+'</div>';n.textContent=(S.mode==='hotseat'||S.mode==='online')?t('ev'):t('role')}
else if(S.phase==='roles'){b.innerHTML='<div class="card"><div style="font-size:1.25rem;font-weight:700;color:var(--g)">'+r.name+'</div><p class="muted">'+r.priv+'</p></div>';n.textContent=t('ev')}
else if(S.phase==='evidence'){b.innerHTML=c.evidence.map((e,i)=>'<div class="card"><div class="vid">🎬 '+(i+1)+'</div><strong>'+e.t+'</strong><p class="muted">'+e.d+'</p></div>').join('');n.textContent=t('dis')}
else if(S.phase==='discussion'){b.innerHTML='<div class="card"><p class="muted">'+t('dis')+'</p></div>';n.textContent=t('vote')}
else if(S.phase==='voting'){if(S.mode==='hotseat'){if(typeof S.votePlayerIndex!=='number')S.votePlayerIndex=0;if(S.votePlayerIndex>=S.players.length){const counts={};Object.keys(S.votes).forEach(name=>{const v=S.votes[name];counts[v]=(counts[v]||0)+1});let winner=null,max=0;Object.keys(counts).forEach(k=>{if(counts[k]>max){max=counts[k];winner=k}});S.vote=winner;S.phase='finale';renderGame();return}const pn=S.players[S.votePlayerIndex].name;b.innerHTML='<div class="card"><p class="muted">'+pn+'</p>'+c.votes.map(v=>'<button type="button" class="opt" data-id="'+v.id+'">'+v.l+'</button>').join('')+'</div>';document.querySelectorAll('#body .opt').forEach(x=>{x.onclick=function(){S.votes[pn]=x.getAttribute('data-id');S.votePlayerIndex++;renderGame()}});n.classList.add('hidden');return}b.innerHTML='<div class="card"><p style="font-weight:600">'+t('who')+'</p>'+c.votes.map(v=>'<button type="button" class="opt'+(S.vote===v.id?' sel':'')+'" data-id="'+v.id+'">'+v.l+'</button>').join('')+'</div>';document.querySelectorAll('#body .opt').forEach(x=>{x.onclick=function(){S.vote=x.getAttribute('data-id');if(S.mode==='online')broadcast({type:'vote',name:S.user.name,choice:S.vote});renderGame()}});n.textContent=t('rev')}
else if(S.phase==='finale'){const ok=S.vote===c.correct;b.innerHTML='<div class="card" style="text-align:center"><p class="tag">FINALE</p><div style="font-weight:700;color:'+(ok?'var(--s)':'var(--d)')+'">'+(ok?t('ok'):t('bad'))+'</div><p class="muted" style="margin-top:.6rem;text-align:start">'+c.finale+'</p></div>';n.textContent=t('home')}}
function defaultNext(){if(S.phase==='voting'&&S.mode!=='hotseat'&&!S.vote){alert(t('needVote'));return}if(S.phase==='finale'){S.user.xp+=50;S.user.pts+=10;if(S.user.xp>=S.user.level*100){S.user.xp-=S.user.level*100;S.user.level++}save();cleanupPeer();S.mode='solo';home();return}if((S.mode==='hotseat'||S.mode==='online')&&S.phase==='intro'){S.phase='evidence';if(S.mode==='online'&&isHost)broadcast({type:'phase',phase:S.phase});renderGame();return}S.phase=P[P.indexOf(S.phase)+1];if((S.mode==='hotseat'||S.mode==='online')&&S.phase==='roles')S.phase='evidence';if(S.phase==='voting')S.votePlayerIndex=0;if(S.mode==='online'&&isHost)broadcast({type:'phase',phase:S.phase,vote:S.vote});renderGame()}
document.getElementById('next').onclick=defaultNext;document.getElementById('exit').onclick=function(){cleanupPeer();home()};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
boot();
</script></body></html>
